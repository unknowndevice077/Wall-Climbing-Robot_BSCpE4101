# Builds the web UI and the firmware on every pull request and every push to main.
# If this fails, the PR cannot be merged (once branch protection is on).
name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Web + firmware build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ----- web UI -----
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build web UI
        working-directory: web
        run: npm run build
      - name: Build web UI into firmware/data (protocol check + gzip)
        run: node scripts/build-web.mjs

      # ----- firmware -----
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install "platformio>=6.1,<7"
      - name: Build firmware
        working-directory: firmware
        run: pio run -e esp32dev
      - name: Build filesystem image
        working-directory: firmware
        run: pio run -e esp32dev -t buildfs
      - name: Run PC unit tests
        working-directory: firmware
        run: pio test -e native
