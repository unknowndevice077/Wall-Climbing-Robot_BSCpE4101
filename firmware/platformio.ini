; PlatformIO config for the robot firmware. Open the `firmware/` folder in VS Code + PlatformIO.
;   Build:                 pio run
;   Upload web UI files:   pio run -t uploadfs     (run scripts/build-web.mjs first!)
;   Upload firmware:       pio run -t upload
;   Serial monitor:        pio device monitor
;   PC unit tests:         pio test -e native      (needs gcc/g++, see test/README.md)

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Official platform 7.1.3 = Arduino-ESP32 core 2.0.17. Do not change without the lead (docs/decisions.md).
platform = espressif32 @ 7.1.3
board = esp32dev  ; TODO(hardware): confirm exact ESP32 board model
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
build_src_flags = -Wall -Wextra
; Networking (AsyncTCP) runs on core 0; the control task runs on core 1 (see config.h).
build_flags = -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
; Exact versions. Adding a library needs the lead's OK.
lib_deps =
  esp32async/AsyncTCP @ 3.5.0
  esp32async/ESPAsyncWebServer @ 3.12.1
  bblanchon/ArduinoJson @ 7.2.2

[env:native]
; Unit tests of plain C++ logic (state machine, protocol parser) on the PC. No ESP32 needed.
platform = native
test_framework = unity
build_flags = -std=gnu++14 -I include
lib_deps =
  bblanchon/ArduinoJson @ 7.2.2
